<!DOCTYPE html>
<html lang="zh-CN" data-theme="warm" data-dark="false" data-font="m" data-leading="normal" data-width="normal">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="按课程顺序系统学习 JavaScript：从基础语法、BOM、DOM 到 ES6、面向对象、异步交互与 jQuery。" />
  <title>JavaScript 系统学习 · 课程笔记精编</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e76f00'/%3E%3Ctext x='16' y='22' font-size='13' font-family='monospace' font-weight='bold' text-anchor='middle' fill='%23fff'%3EJS%3C/text%3E%3C/svg%3E" />
  <script>
    /* 首屏防闪：在样式加载前先把上次选择的主题与阅读参数写到 html 上 */
    (function () {
      var THEMES = ['warm', 'slate', 'forest', 'ocean', 'rose', 'midnight'];
      var saved = null;
      try { saved = JSON.parse(localStorage.getItem('jsweb.appearance') || 'null'); } catch (e) {}
      var q = new URLSearchParams(location.search).get('theme');
      if (q && THEMES.indexOf(q) > -1) saved = Object.assign({}, saved || {}, { theme: q });
      if (!saved) return;
      var root = document.documentElement;
      var t = THEMES.indexOf(saved.theme) > -1 ? saved.theme : 'warm';
      root.setAttribute('data-theme', t);
      root.setAttribute('data-dark', t === 'midnight' ? 'true' : 'false');
      if (saved.ink && saved.ink !== 'auto') root.setAttribute('data-ink', saved.ink);
      if (saved.codeBg) root.setAttribute('data-code-bg', saved.codeBg);
      if (saved.codeInk) root.setAttribute('data-code-ink', saved.codeInk);
      if (saved.font) root.setAttribute('data-font', saved.font);
      if (saved.leading) root.setAttribute('data-leading', saved.leading);
      if (saved.width) root.setAttribute('data-width', saved.width);
    })();
  </script>
  <link rel="stylesheet" href="assets/css/style.css?v=20261120b" />
</head>
<body>

  <!-- ================= 顶栏（整页宽） ================= -->
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="打开目录">
      <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>

    <a class="brand" href="#/home">
      <span class="brand-mark">JS</span>
      <span class="brand-text">
        <span class="brand-name">JavaScript 系统学习</span>
        <span class="brand-sub">课程笔记精编 · 001–199</span>
      </span>
    </a>

    <nav class="topbar-nav" aria-label="主导航">
      <a href="#/home" data-nav="home" class="active">首页</a>
      <a href="#/roadmap" data-nav="roadmap">学习路线</a>
      <a href="#/playground" data-nav="playground">练习场</a>
      <a href="#/notes" data-nav="notes">我的笔记</a>
    </nav>

    <div class="topbar-spacer"></div>

    <button class="icon-btn" id="themeBtn" aria-label="切换明暗" title="快速切换明暗">
      <svg viewBox="0 0 24 24" class="icon icon-sun" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg viewBox="0 0 24 24" class="icon icon-moon" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
    </button>
    <button class="icon-btn" id="settingsBtn" aria-label="阅读外观设置" title="阅读外观设置">
      <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="8" cy="9" r="1.4"/><circle cx="12" cy="7.5" r="1.4"/><circle cx="16" cy="9" r="1.4"/><circle cx="16.5" cy="13.5" r="1.4"/><circle cx="12" cy="15.5" r="1.4"/><circle cx="7.5" cy="13.5" r="1.4"/></svg>
    </button>
    <button class="text-btn" id="doneBtn" hidden>
      <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M4 12l5 5L20 6"/></svg>
      <span>标记已学</span>
    </button>

    <div class="read-progress" id="readProgress" hidden></div>

    <div class="settings-panel" id="settingsPanel" hidden>
      <div class="settings-head"><strong>阅读外观</strong><button id="settingsReset" type="button">重置</button></div>
      <div class="settings-body">
      <div class="settings-group">
        <label>主题风格 <span class="label-note">· 整套配色</span></label>
        <div class="theme-grid" data-group="theme">
          <button type="button" data-val="warm" title="暖纸橙 · 默认">
            <span class="theme-prev prev-warm"></span><span class="theme-name">暖纸橙</span>
          </button>
          <button type="button" data-val="slate" title="石墨靛 · 冷灰">
            <span class="theme-prev prev-slate"></span><span class="theme-name">石墨靛</span>
          </button>
          <button type="button" data-val="forest" title="森绿 · 米绿底">
            <span class="theme-prev prev-forest"></span><span class="theme-name">森绿</span>
          </button>
          <button type="button" data-val="ocean" title="海蓝 · 淡蓝底">
            <span class="theme-prev prev-ocean"></span><span class="theme-name">海蓝</span>
          </button>
          <button type="button" data-val="rose" title="玫瑰 · 浅粉底">

          </button>
          <button type="button" data-val="midnight" title="深夜 · 暗色">
            <span class="theme-prev prev-midnight"></span><span class="theme-name">深夜</span>
          </button>
        </div>
      </div>
      <div class="settings-group">
        <label>正文文字颜色 <span class="label-note">· 只改字色</span></label>
        <div class="opt-grid" data-group="ink">
          <button type="button" class="opt" data-val="auto"><i class="ink-auto"></i>自动</button>
          <button type="button" class="opt" data-val="black"><i class="ink-black"></i>纯黑</button>
          <button type="button" class="opt" data-val="gray"><i class="ink-gray"></i>深灰</button>
          <button type="button" class="opt" data-val="brown"><i class="ink-brown"></i>暖褐</button>
          <button type="button" class="opt" data-val="navy"><i class="ink-navy"></i>藏青</button>
        </div>
      </div>
      <div class="settings-group">
        <label>代码块背景</label>
        <div class="opt-grid" data-group="codeBg">
          <button type="button" class="opt" data-val="dark"><i class="cb-dark"></i>深墨</button>
          <button type="button" class="opt" data-val="black"><i class="cb-black"></i>纯黑</button>
          <button type="button" class="opt" data-val="navy"><i class="cb-navy"></i>深蓝</button>
          <button type="button" class="opt" data-val="light"><i class="cb-light"></i>浅色</button>
        </div>
      </div>
      <div class="settings-group">
        <label>代码字体颜色</label>
        <div class="opt-grid" data-group="codeInk">
          <button type="button" class="opt" data-val="default"><i class="ci-default"></i>彩色</button>
          <button type="button" class="opt" data-val="bright"><i class="ci-bright"></i>高亮</button>
          <button type="button" class="opt" data-val="soft"><i class="ci-soft"></i>柔和</button>
          <button type="button" class="opt" data-val="mono"><i class="ci-mono"></i>单色</button>
        </div>
      </div>
      <div class="settings-group">
        <label>排版</label>
        <div class="two-col">
          <div class="mini">
            <label>正文字号</label>
            <div class="seg" data-group="font">
              <button type="button" data-val="s">小</button>
              <button type="button" data-val="m">标准</button>
              <button type="button" data-val="l">大</button>
              <button type="button" data-val="xl">特大</button>
            </div>
          </div>
          <div class="mini">
            <label>行间距</label>
            <div class="seg" data-group="leading">
              <button type="button" data-val="compact">紧凑</button>
              <button type="button" data-val="normal">标准</button>
              <button type="button" data-val="relaxed">宽松</button>
            </div>
          </div>
          <div class="mini">
            <label>内容宽度</label>
            <div class="seg" data-group="width">
              <button type="button" data-val="narrow">窄</button>
              <button type="button" data-val="normal">标准</button>
              <button type="button" data-val="wide">宽</button>
            </div>
          </div>
        </div>
      </div>
      </div>
      <div class="settings-tip">主题与阅读参数会自动保存在本机浏览器；也可以用 <code>?theme=warm</code> 这类链接直接指定主题。</div>
    </div>
  </header>

  <!-- ================= 外壳：左目录 + 中内容 + 右小节 ================= -->
